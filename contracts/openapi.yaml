    NLQueryPlan:
      properties:
        intent:
          type: string
          enum:
          - top_loss_drivers
          - eal_summary
          - choke_points
          - portfolio_summary
          - control_lookup
          - cci_summary
          - scenario_detail
          - asset_detail
          - compare_budgets
          - exceedance_at_loss
          - unsupported
          title: Intent
        filters:
          additionalProperties:
            anyOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
          type: object
          title: Filters
          default: {}
        limit:
          type: integer
          title: Limit
          default: 10
      type: object
      required:
      - intent
      title: NLQueryPlan
      description: What the LLM is allowed to emit. Nothing else. It never returns
        numbers.
    NLQueryRequest:
      properties:
        run_id:
          type: string
          title: Run Id
        question:
          type: string
          title: Question
      type: object
      required:
      - run_id
      - question
      title: NLQueryRequest
    NLQueryResponse:
      properties:
        plan:
          $ref: '#/components/schemas/NLQueryPlan'
        data:
          additionalProperties: true
          type: object
          title: Data
        narrative:
          type: string
          title: Narrative
          description: Generated from data. The LLM never invents a figure.
      type: object
      required:
      - plan
      - data
      - narrative
