[project]
name = "crq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6","fastapi>=0.110","uvicorn[standard]>=0.27","crq-core","crq-ingest","crq-compliance"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crq_api*"]
