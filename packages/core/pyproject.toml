[project]
name = "crq-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6","numpy>=1.26","scipy>=1.11","networkx>=3.2","ortools>=9.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crq_core*"]
